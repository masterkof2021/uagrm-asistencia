AWSTemplateFormatVersion: '2010-09-09'
Description: Stack raiz de asistencia con red, seguridad y tres servidores EC2.
Metadata:
  AWSToolsMetrics:
    AWSAgentToolkit: aws-cloudformation@3
Parameters:
  IncludePublicOutputs:
    Type: String
    Default: 'false'
    AllowedValues: ['false', 'true']
    Description: Dejar false si alguna EC2 esta detenida; las salidas PublicIp requieren instancias en ejecucion.
  OperatorIngressCidrParameter:
    Type: AWS::SSM::Parameter::Value<String>
    Description: Nombre del parametro de Systems Manager que contiene la IPv4 autorizada con /32.
  S3PrefixListId:
    Type: String
    AllowedPattern: "^pl-[0-9a-f]+$"
    Description: Lista administrada com.amazonaws.us-east-2.s3; resolver en la region antes de desplegar.
  SshPublicKey:
    Type: String
    Description: Contenido de globomatics-ec2.pub; nunca pegar la clave privada.
    AllowedPattern: '^(ssh-ed25519|ssh-rsa|ecdsa-sha2-\S+) [A-Za-z0-9+/]+={0,2}( .*)?$'
  InstanceType:
    Type: String
    Default: t3.micro
    AllowedValues: [t3.micro]
    Description: Tipo de laboratorio limitado para evitar seleccion accidental costosa.
  AmazonLinuxAmi:
    Type: AWS::EC2::Image::Id
    Description: ID fijo de una AMI Amazon Linux 2023 x86_64 en Ohio.
Conditions:
  ShowPublicOutputs: !Equals [!Ref IncludePublicOutputs, 'true']
Resources:
  ResourceGroup:
    Type: AWS::ResourceGroups::Group
    Properties:
      Name: !Sub '${AWS::StackName}-recursos'
      Description: Recursos exclusivos del laboratorio CloudFormation.
      ResourceQuery:
        Type: TAG_FILTERS_1_0
        Query:
          ResourceTypeFilters: ['AWS::AllSupported']
          TagFilters:
            - Key: Deployment
              Values: [!Ref 'AWS::StackName']
      Tags:
        - {Key: Deployment, Value: !Ref 'AWS::StackName'}
  Network:
    Type: AWS::CloudFormation::Stack
    Metadata:
      com.aws.cloudformation.Context:
        why: Gestiona la VPC, su ruta y el registro de trafico rechazado.
        must: [Usar el nombre raiz para etiquetas y buckets.]
    Properties:
      TemplateURL: nested/network.yaml
      Parameters:
        DeploymentName: !Ref AWS::StackName
  Security:
    Type: AWS::CloudFormation::Stack
    Metadata:
      com.aws.cloudformation.Context:
        why: Define quien se comunica con cada capa de la aplicacion.
        must: [API desde el cliente, MySQL y SSH de datos desde el backend.]
    Properties:
      TemplateURL: nested/security.yaml
      Parameters:
        DeploymentName: !Ref AWS::StackName
        VpcId: !GetAtt Network.Outputs.VpcId
        SshIngressCidr: !Ref OperatorIngressCidrParameter
        WebIngressCidr: !Ref OperatorIngressCidrParameter
        S3PrefixListId: !Ref S3PrefixListId
  Compute:
    Type: AWS::CloudFormation::Stack
    Metadata:
      com.aws.cloudformation.Context:
        why: Instancia los tres servidores despues de configurar la red y sus reglas.
        must: [Usar grupos de seguridad distintos y preservar la instancia de datos.]
    Properties:
      TemplateURL: nested/compute.yaml
      Parameters:
        DeploymentName: !Ref AWS::StackName
        SubnetId: !GetAtt Network.Outputs.PublicSubnetId
        ClientSecurityGroupId: !GetAtt Security.Outputs.ClientSecurityGroupId
        BackendSecurityGroupId: !GetAtt Security.Outputs.BackendSecurityGroupId
        DatabaseSecurityGroupId: !GetAtt Security.Outputs.DatabaseSecurityGroupId
        IncludePublicOutputs: !Ref IncludePublicOutputs
        SshPublicKey: !Ref SshPublicKey
        InstanceType: !Ref InstanceType
        ImageId: !Ref AmazonLinuxAmi
Outputs:
  VpcId:
    Description: Red exclusiva de este stack, distinta de la administrada por Pulumi.
    Value: !GetAtt Network.Outputs.VpcId
  ClientInstanceId:
    Description: Instancia cliente; utilizar para iniciar o detener el laboratorio.
    Value: !GetAtt Compute.Outputs.ClientInstanceId
  BackendInstanceId:
    Description: Instancia backend; ejecuta Node.js.
    Value: !GetAtt Compute.Outputs.BackendInstanceId
  ClientPublicIp:
    Condition: ShowPublicOutputs
    Description: IP dinamica del cliente; consultar de nuevo tras detener e iniciar.
    Value: !GetAtt Compute.Outputs.ClientPublicIp
  BackendPublicIp:
    Condition: ShowPublicOutputs
    Description: IP dinamica del backend; consultar de nuevo tras detener e iniciar.
    Value: !GetAtt Compute.Outputs.BackendPublicIp
  ClientPrivateIp:
    Description: Direccion privada del cliente Nginx.
    Value: !GetAtt Compute.Outputs.ClientPrivateIp
  BackendPrivateIp:
    Description: Destino de proxy_pass de Nginx, puerto 8090.
    Value: !GetAtt Compute.Outputs.BackendPrivateIp
  FrontendUrl:
    Condition: ShowPublicOutputs
    Description: Disponible despues de instalar Nginx y la aplicacion manualmente.
    Value: !GetAtt Compute.Outputs.FrontendUrl
  ClientSsh:
    Condition: ShowPublicOutputs
    Description: Comando desde el PC que conserva la clave privada correspondiente.
    Value: !GetAtt Compute.Outputs.ClientSsh
  BackendSsh:
    Condition: ShowPublicOutputs
    Description: Comando desde el PC que conserva la clave privada correspondiente.
    Value: !GetAtt Compute.Outputs.BackendSsh
  DatabaseInstanceId:
    Description: Instancia de datos con politica de retencion.
    Value: !GetAtt Compute.Outputs.DatabaseInstanceId
  DatabasePrivateIp:
    Description: Destino DB_HOST de la API.
    Value: !GetAtt Compute.Outputs.DatabasePrivateIp
