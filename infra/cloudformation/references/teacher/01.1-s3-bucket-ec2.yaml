AWSTemplateFormatVersion: "2010-09-09"
Description: Bucket S3 y una instancia EC2 de Globomatics (ejemplo 1.1)

Parameters:
  Proyecto:
    Type: String
    Default: globomatics

  Ambiente:
    Type: String
    Default: dev
    AllowedValues: [dev, qa, prod]

  TipoInstancia:
    Type: String
    Default: t3.micro
    AllowedValues: [t3.micro, t3.small]

  ImagenLinux:
    Type: AWS::SSM::Parameter::Value<AWS::EC2::Image::Id>
    Default: /aws/service/ami-amazon-linux-latest/al2023-ami-kernel-default-x86_64

Resources:
  Bucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Sub "${Proyecto}-${Ambiente}-${AWS::AccountId}"
      Tags:
        - Key: Proyecto
          Value: !Ref Proyecto
        - Key: Ambiente
          Value: !Ref Ambiente

  Instancia:
    Type: AWS::EC2::Instance
    Properties:
      ImageId: !Ref ImagenLinux
      InstanceType: !Ref TipoInstancia
      Tags:
        - Key: Name
          Value: !Sub "vm-${Proyecto}-${Ambiente}"
        - Key: Proyecto
          Value: !Ref Proyecto
        - Key: Ambiente
          Value: !Ref Ambiente

Outputs:
  NombreBucket:
    Description: Nombre del bucket creado
    Value: !Ref Bucket

  ArnBucket:
    Description: ARN del bucket (su identificador completo en AWS)
    Value: !GetAtt Bucket.Arn

  IdInstancia:
    Description: ID de la instancia EC2
    Value: !Ref Instancia

  IpPublica:
    Description: IP pública de la instancia
    Value: !GetAtt Instancia.PublicIp
